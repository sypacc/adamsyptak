name: Deploy to GitHub Pages

# Builds the site (Vite) and publishes dist/ to GitHub Pages.
#
# Only claude/friendly-rubin-5tbair may deploy (rule on the github-pages
# environment), so this runs on pushes to that branch and on manual dispatch.
# Nobody has to touch that branch by hand: sync-deploy.yml mirrors main into
# it after every merge and dispatches this workflow. Flow: PR into main,
# merge, done (see CLAUDE.md).
on:
  push:
    branches: [claude/friendly-rubin-5tbair]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # While Settings → Pages → Source is "Deploy from a branch", GitHub also
      # runs its own "pages build and deployment" for the same push and
      # publishes the unbuilt source (a blank page). Whichever deployment
      # finishes last wins, so wait until every other run for this commit has
      # finished and deploy after it. With Source set to "GitHub Actions"
      # there is no other run and this step returns at once.
      - name: Let any other deployment of this commit finish first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do
            busy=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=50" \
              --jq "[.workflow_runs[] | select(.id != ${GITHUB_RUN_ID} and .status != \"completed\")] | length")
            if [ "$busy" = "0" ]; then
              echo "No other deployment in progress."
              exit 0
            fi
            echo "Waiting for $busy other run(s) of this commit…"
            sleep 10
          done
          echo "Still busy after 5 minutes; deploying anyway."
      - id: deployment
        uses: actions/deploy-pages@v4
