name: Deploy to GitHub Pages

# The site is a Vite build, so Pages must be set to Source: "GitHub Actions"
# (Settings → Pages). Serving a branch directly publishes the unbuilt source
# and the page renders blank.
# Only claude/friendly-rubin-5tbair may deploy (rule on the github-pages
# environment), so pushes to main don't run this: they would only fail at the
# deploy step or cancel a real deploy that is in flight. Flow: PR into main,
# then PR main -> claude/friendly-rubin-5tbair (see CLAUDE.md).
on:
  push:
    branches: [claude/friendly-rubin-5tbair]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
