<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TrackWise — Lekce závodního řízení</title>
  <meta name="description" content="TrackWise — lekce závodního řízení na okruhu. Rezervuj si trénink.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0d">

  <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    // Nastaví uložený režim ještě před vykreslením, ať nebliká špatná barva.
    (function () {
      try {
        var t = localStorage.getItem('tw-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/project-main.jsx"></script>
</body>
</html>
