<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TrackWise — Lekce závodního řízení</title>
  <meta name="description" content="TrackWise — lekce závodního řízení na okruhu. Rezervuj si trénink.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="dark light">

  <meta property="og:type" content="website">
  <meta property="og:locale" content="cs_CZ">

  <meta property="og:title" content="TrackWise — Lekce závodního řízení">
  <meta property="og:description" content="Individuální trénink na okruhu s instruktorem. Vyber délku, termín a rezervuj online.">

  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">

  <script>
    // Po nasazení nové verze může prohlížeč z cache podat staré HTML, které
    // odkazuje na už smazané soubory v /assets/ – stránka by zůstala prázdná.
    // Pak ji jednou obnovíme (čerstvé HTML). Příznak maže aplikace po spuštění.
    (function () {
      var key = 'asset-reload';
      window.addEventListener('error', function (e) {
        var el = e.target;
        if (!el || (el.tagName !== 'SCRIPT' && el.tagName !== 'LINK')) return;
        if ((el.src || el.href || '').indexOf('/assets/') === -1) return;
        try {
          if (sessionStorage.getItem(key)) return;
          sessionStorage.setItem(key, '1');
        } catch (err) { return; }
        location.reload();
      }, true);
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="%BASE_URL%assets/img/favicon.svg">
  <link rel="preload" href="/node_modules/@fontsource/barlow-condensed/files/barlow-condensed-latin-800-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="%BASE_URL%assets/project/hero-poster-720.webp" as="image" type="image/webp" media="(max-width: 760px)">
  <link rel="preload" href="%BASE_URL%assets/project/hero-poster-1280.webp" as="image" type="image/webp" media="(min-width: 761px)">
  <script>
    // Nastaví uložený režim ještě před vykreslením, ať nebliká špatná barva.
    (function () {
      try {
        var t = localStorage.getItem('tw-theme');
        if (t === 'light' || t === 'dark') {
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/project-main.jsx"></script>
</body>
</html>
